<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 120 120">
  <!-- Shoply: Item Scan & Analytics logo (the app icon, assets/shoply-icon.png,
       is this with square corners: Shopify rounds them itself).
       A shopping bag (the shop) inside amber scan corners (the scan), with a
       rising line on it (the analytics). Navy, so it isn't Shopify's green bag. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24375f"/>
      <stop offset="1" stop-color="#15223d"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#bg)"/>
  <path d="M18 36V24a6 6 0 0 1 6-6h12M84 18h12a6 6 0 0 1 6 6v12M102 84v12a6 6 0 0 1-6 6H84M36 102H24a6 6 0 0 1-6-6V84" fill="none" stroke="#f5a623" stroke-width="6" stroke-linecap="round"/>
  <path d="M40 42h40a4 4 0 0 1 4 3.6l4 38a6 6 0 0 1-6 6.4H38a6 6 0 0 1-6-6.4l4-38A4 4 0 0 1 40 42z" fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
  <path d="M50 54V40a10 10 0 0 1 20 0v14" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="50" cy="54" r="3.5" fill="#fff"/>
  <circle cx="70" cy="54" r="3.5" fill="#fff"/>
  <path d="M44 80l8-8 6 5 12-13" fill="none" stroke="#f5a623" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
