<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <!-- Animated header logo: the trail draws in behind the rocket as it flies under the globe and up the right side, once. Ends exactly like the still logo. -->
  <defs><linearGradient id="trail" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#15223d" stop-opacity="0"/><stop offset="1" stop-color="#15223d"/></linearGradient></defs>
  <path d="M40 12 A28 28 0 0 0 40 68 Z" fill="#15223d"/>
  <path d="M40 12 A28 28 0 0 1 40 68 Z" fill="#f5a623"/>
  <ellipse cx="40" cy="40" rx="12" ry="28" fill="none" stroke="#fff" stroke-width="3.5"/>
  <path d="M12 40 H68" stroke="#fff" stroke-width="3.5"/>
  <path id="flight" d="M14 62 C24 82 66 82 73 56 C77 40 76 24 71 9" pathLength="1" fill="none" stroke="url(#trail)" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" from="1" to="0" begin="0.3s" dur="2.4s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .25 1"/>
  </path>
  <g>
    <animateMotion begin="0.3s" dur="2.4s" fill="freeze" rotate="auto" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".45 0 .25 1"><mpath href="#flight"/></animateMotion>
    <g transform="rotate(90) scale(1.1)">
    <path d="M0 6 L-2 11 L0 9.5 L2 11 Z" fill="#f5a623"/>
    <path d="M0 -8 C3.6 -5 3.8 1 2.6 6 H-2.6 C-3.8 1 -3.6 -5 0 -8 Z" fill="#15223d"/>
    <path d="M-2.6 2 L-5 7 L-2.4 6 Z M2.6 2 L5 7 L2.4 6 Z" fill="#15223d"/>
    <circle cx="0" cy="-1.5" r="1.4" fill="#fff"/>
    </g>
  </g>
</svg>
