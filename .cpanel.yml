---
# Tells cPanel what to copy into the site's folder when you click "Deploy HEAD Commit".
# Copies only the site files; nothing else in public_html is touched or deleted.
# Files with the same name (index.html, privacy.html, terms.html, robots.txt, sitemap.xml, llms.txt, assets/..., blog/...) are overwritten.
deployment:
  tasks:
    - export DEPLOYPATH=/home/tscrtki8z231/public_html/
    - /bin/cp index.html privacy.html terms.html robots.txt sitemap.xml llms.txt 0fe5b15d83c018410175042095b9e3c9.txt $DEPLOYPATH
    - /bin/mkdir -p ${DEPLOYPATH}assets
    - /bin/cp -R assets/. ${DEPLOYPATH}assets/
    - /bin/mkdir -p ${DEPLOYPATH}blog
    - /bin/cp -R blog/. ${DEPLOYPATH}blog/
