<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shoply Apps</title>
  <meta name="description" content="Shoply Apps builds Shopify apps. Our first app, Shoply: Item Scan & Analytics, is coming soon.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    :root { --navy: #15223d; --amber: #f5a623; --text: #eef2f8; --muted: #a9b4c8; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 32px 16px; background: var(--navy); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
    }
    img { width: 96px; height: 96px; border-radius: 20px; }
    h1 { margin: 24px 0 8px; font-size: clamp(28px, 6vw, 44px); }
    p { margin: 0 auto; max-width: 32em; color: var(--muted); line-height: 1.6; }
    .tag { display: inline-block; margin-top: 24px; padding: 6px 14px; border: 1px solid var(--amber);
           border-radius: 999px; color: var(--amber); font-size: 14px; }
    a { color: var(--amber); }
  </style>
</head>
<body>
  <main>
    <img src="assets/logo.svg" alt="Shoply Apps logo">
    <h1>Shoply Apps</h1>
    <p>We build Shopify apps. Our first app, <strong>Shoply: Item Scan &amp; Analytics</strong>, finds problems in your catalog and shows what sells.</p>
    <span class="tag">Coming soon</span>
    <p style="margin-top:24px"><a href="mailto:info@shoplyapps.com">info@shoplyapps.com</a></p>
  </main>
</body>
</html>
